# Tiny Tapeout project information
project:
  title:        "Leonidas"      # Project title
  author:       "Raghuv Potdar"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Jane Street protocol emulator ASIC competition"      # One line description of what your project does
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_RaghuvPotdar_Leonidas"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "uart.sv"
    - "sram_256x16.sv"
    - "imem.sv"
    - "rf.sv"
    - "datapath.sv"
    - "leonidas.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs. One byte of a 16-bit instruction. Low byte first.
  ui[0]: "byte[0]"
  ui[1]: "byte[1]"
  ui[2]: "byte[2]"
  ui[3]: "byte[3]"
  ui[4]: "byte[4]"
  ui[5]: "byte[5]"
  ui[6]: "byte[6]"
  ui[7]: "byte[7]"

  # Program pins. Idle high. The UART example drives out1.
  uo[0]: "out0"
  uo[1]: "out1"
  uo[2]: "out2"
  uo[3]: "out3"
  uo[4]: "usb_dp"
  uo[5]: "usb_dm"
  uo[6]: "out6"
  uo[7]: "out7"

  # 00 idle, 01 load byte, 10 last byte and start, 11 reserved.
  uio[0]: "strobe[0]"
  uio[1]: "strobe[1]"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
